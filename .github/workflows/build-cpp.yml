name: Build Android JNI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a }
          - { abi: armeabi-v7a }
          - { abi: x86 }
          - { abi: x86_64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK r27
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: true

      - name: Build with CMake
        run: |
          mkdir -p build_${{ matrix.abi }}
          cd build_${{ matrix.abi }}
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_NATIVE_API_LEVEL=21 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Organize Output
        run: |
          mkdir -p jniLibs/${{ matrix.abi }}
          cp build_${{ matrix.abi }}/libinoadb.so jniLibs/${{ matrix.abi }}/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libinoadb-${{ matrix.abi }}
          path: jniLibs/${{ matrix.abi }}/
